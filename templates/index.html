<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پردازش هوشمند صوت و تصویر</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 50px; text-align: center; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { color: #333; }
        input[type="file"] { margin: 20px 0; padding: 10px; border: 1px solid #ccc; border-radius: 6px; width: 80%; }
        button { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .result-box { margin-top: 20px; background: #e9ecef; padding: 15px; border-radius: 6px; text-align: left; direction: ltr; white-space: pre-wrap; }
        .alert-success { color: #28a745; margin-top: 15px; font-weight: bold; }
        .alert-error { color: #dc3545; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>سامانه پردازش هوشمند فایل</h2>
        <p>فایل صوتی خود را برای پردازش یا عکس خود را برای استخراج متن آپلود کنید:</p>
        
        <form action="/process" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required><br>
            <button type="submit">آپلود و پردازش</button>
        </form>

        {% if extracted_text %}
            <div class="result-box">
                <strong>متن استخراج‌شده از تصویر:</strong><br>
                {{ extracted_text }}
            </div>
        {% endif %}

        {% if success %}
            <div class="alert-success">{{ success }}</div>
        {% endif %}

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
