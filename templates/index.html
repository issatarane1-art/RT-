<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT - جداکننده حرفه‌ای صدا</title>
    <style>
        body { 
            background: url('/static/pic.jpg') no-repeat center center fixed;
background-size: cover;
            color: #fff; 
            font-family: Tahoma, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: rgba(15, 23, 42, 0.88); 
            backdrop-filter: blur(10px); 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3); 
            text-align: center; 
            width: 90%; 
            max-width: 420px; 
            border: 1px solid rgba(0, 210, 255, 0.4); 
        }
        .logo { 
            font-size: 52px; 
            font-weight: 900; 
            color: #00d2ff; 
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.9), 0 0 40px rgba(0, 210, 255, 0.5); 
            margin: 0; 
            letter-spacing: 3px; 
        }
        h2 { 
            color: #ffffff; 
            margin-top: 5px; 
            margin-bottom: 25px; 
            font-size: 16px; 
            opacity: 0.9; 
        }
        input[type='file'] { margin: 20px 0; color: #ccc; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(90deg, #00d2ff, #3a7bd5); 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            font-size: 15px; 
            cursor: pointer; 
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); 
        }
        button:hover { opacity: 0.9; box-shadow: 0 0 20px rgba(0, 210, 255, 0.7); }
        #progress-container { display: none; margin-top: 25px; }
        .progress-bar-bg { width: 100%; background-color: #2d2d38; border-radius: 10px; overflow: hidden; height: 12px; margin-top: 10px; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00d2ff, #00b894); border-radius: 10px; transition: width 0.4s ease; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .result { margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-dl { display: block; margin: 10px 0; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; color: white; }
        .vocals { background-color: #e91e63; box-shadow: 0 0 10px rgba(233, 30, 99, 0.5); }
        .music { background-color: #00b894; box-shadow: 0 0 10px rgba(0, 184, 148, 0.5); }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="logo">RT</h1>
        <h2>جداکننده هوشمند صدا</h2>
        <form id="upload-form" action="/process" method="post" enctype="multipart/form-data" onsubmit="showProgress()">
            <input type="file" name="audio" accept="audio/*" required><br>
            <button type="submit" id="submit-btn">شروع پردازش</button>
        </form>
        <div id="progress-container">
            <p id="progress-text" style="color: #00d2ff; font-size: 14px; margin: 0;">در حال پردازش و جداسازی صدا...</p>
            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
        </div>
        {% if processed %}
        <div class="result">
            <p style="color: #00b894; margin-bottom: 15px;">پردازش با موفقیت انجام شد!</p>
            <a href="/download/{{ folder_name }}/vocals.wav" class="btn-dl vocals" download>دانلود صدای خواننده</a>
<a href="/download/{{ folder_name }}/no_vocals.wav" class="btn-dl music" download>دانلود موزیک بی‌کلام</a>
        </div>
        {% endif %}
    </div>
    <script>
        function showProgress() {
            document.getElementById('upload-form').style.display = 'none';
            document.getElementById('progress-container').style.display = 'block';
            let fill = document.getElementById('progress-fill');
            let width = 0;
            let interval = setInterval(function() {
                if (width < 90) { width += 1; fill.style.width = width + '%'; } else { clearInterval(interval); }
            }, 400);
        }
    </script>
</body>
</html>
